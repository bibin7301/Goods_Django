{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="min-h-screen bg-red-950 flex items-center justify-center px-4">


<div class="w-full max-w-sm">

    <!-- LOGIN CARD -->
    <div class="bg-white shadow hover:shadow-red-500 rounded-2xl shadow-2xl p-7 sm:p-8">

      

        <!-- LOGIN FORM -->
        <form method="POST">

            {% csrf_token %}

            <!-- USERNAME -->
            <div class="mb-5">

                <label
                    class="block text-sm font-semibold
                           text-gray-700 mb-2">

                    Username

                </label>

                <input
                    type="text"
                    name="username"
                    required
                    placeholder="Enter username"
                    class="w-full px-4 py-3
                           border border-gray-300
                           rounded-lg
                           outline-none
                           focus:border-red-950
                           focus:ring-2
                           focus:ring-red-200
                           transition">

            </div>


            <!-- PASSWORD -->
            <div class="mb-6">

                <label
                    class="block text-sm font-semibold
                           text-gray-700 mb-2">

                    Password

                </label>

                <input
                    type="password"
                    name="password"
                    required
                    placeholder="Enter password"
                    class="w-full px-4 py-3
                           border border-gray-300
                           rounded-lg
                           outline-none
                           focus:border-red-950
                           focus:ring-2
                           focus:ring-red-200
                           transition">

            </div>


            <!-- LOGIN -->
            <button
                type="submit"
                class="w-full
                       bg-red-950
                       text-white
                       py-3
                       rounded-lg
                       font-semibold
                       hover:bg-red-800
                       active:scale-95
                       transition duration-300">

                Login

            </button>
                <a href="/signup" class="text-white " >SIGNUP</a>&nbsp;&nbsp;


        </form>


        <!-- SIGN UP -->
        <p class="text-center text-sm text-gray-500 mt-6">

            Don't have an account?

            <a
                href="{% url 'signup' %}"
                class="text-red-950 font-semibold
                       hover:text-red-700">

                Sign up

            </a>

        </p>

        <a href="{% url 'forgot' %}" class="flex justify-center">
    Forgot Password?
        </a>
        

    </div>

</div>

</div>

{% endblock %}
