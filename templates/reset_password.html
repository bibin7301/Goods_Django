{% extends "base.html" %}

{% block title %}
Reset Password
{% endblock %}

{% block content %}

<div class="min-h-[75vh] flex items-center justify-center px-4">

    <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-lg">

        <!-- Heading -->
        <div class="text-center mb-6">

            <h1 class="text-3xl font-bold text-red-950">
                Reset Password
            </h1>

            <p class="text-gray-500 mt-2">
                Enter your new password below.
            </p>

        </div>


        <!-- Messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-3 rounded-lg bg-red-100 text-red-700 text-sm text-center">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}


        <!-- Reset Password Form -->
        <form method="POST">

            {% csrf_token %}

            <!-- New Password -->
            <label class="block text-sm font-semibold text-gray-700 mb-2">
                New Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter new password"
                autocomplete="new-password"
                required
                class="w-full px-4 py-3 border border-gray-300 rounded-lg
                       focus:outline-none focus:ring-2 focus:ring-red-900
                       focus:border-red-900"
            >


            <!-- Confirm Password -->
            <label class="block text-sm font-semibold text-gray-700 mt-5 mb-2">
                Confirm Password
            </label>

            <input
                type="password"
                name="password2"
                placeholder="Confirm new password"
                autocomplete="new-password"
                required
                class="w-full px-4 py-3 border border-gray-300 rounded-lg
                       focus:outline-none focus:ring-2 focus:ring-red-900
                       focus:border-red-900"
            >


            <!-- Reset Button -->
            <button
                type="submit"
                class="w-full mt-6 bg-red-950 text-white py-3 rounded-lg
                       font-semibold hover:bg-red-900 transition duration-300">
                Reset Password
            </button>

        </form>


        <!-- Back to Login -->
        <div class="text-center mt-6">

            <a
                href="{% url 'login' %}"
                class="text-red-900 font-semibold hover:underline">
                ← Back to Login
            </a>

        </div>

    </div>

</div>

{% endblock %}
